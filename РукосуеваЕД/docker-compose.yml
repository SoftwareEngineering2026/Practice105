name: avatar-generator

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    command: gunicorn wsgi:app --bind 0.0.0.0:5000 --workers 2
    environment:
      REDIS_URL: redis://redis:6379/0
      MEDIA_DIR: /app/media
    volumes:
      - avatars_data:/app/media
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: ./backend
    command: celery -A celery_app worker --loglevel=info
    environment:
      REDIS_URL: redis://redis:6379/0
      MEDIA_DIR: /app/media
    volumes:
      - avatars_data:/app/media
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  avatars_data:
